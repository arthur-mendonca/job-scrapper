x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-job_pipeline}?schema=public
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_COMMAND_ALLOWED_CHAT_IDS: ${TELEGRAM_COMMAND_ALLOWED_CHAT_IDS:-}
  TELEGRAM_POLL_INTERVAL_MS: ${TELEGRAM_POLL_INTERVAL_MS:-1000}
  NOTIFICATION_SCORE_THRESHOLD: ${NOTIFICATION_SCORE_THRESHOLD:-75}
  COLLECT_CRON: ${COLLECT_CRON:-0 */6 * * 1-5}
  SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
  EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_TO: ${EMAIL_TO:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_DIR: ${LOG_DIR:-/app/logs}
  INPUT_EMAIL_ALERTS_DIR: ${INPUT_EMAIL_ALERTS_DIR:-/app/input/email-alerts}
  SOURCES_CONFIG_PATH: ${SOURCES_CONFIG_PATH:-config/sources.example.json}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-3000}
  API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5173}
  INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://app:3000}

services:
  migrate:
    build: .
    restart: "no"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm prisma:migrate

  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: pnpm start:api
    expose:
      - "3000"
    volumes:
      - ./logs:/app/logs

  worker:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./input/email-alerts:/app/input/email-alerts
      - ./logs:/app/logs
    command: pnpm start:worker

  bot:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      app:
        condition: service_started
    command: pnpm start:bot
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_pipeline}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      BASE_URL: http://localhost:8080/
      INSTANCE_NAME: job-intelligence-searxng
    expose:
      - "8080"

volumes:
  postgres-data:
